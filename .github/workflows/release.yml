name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # for npm publish --provenance + trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # requires maintainer approval before this job runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No NODE_AUTH_TOKEN: npm >= 9.9 exchanges the GitHub OIDC token for a
      # short-lived npm credential via trusted publishing automatically.
      - run: npm publish --provenance --access public