name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # for npm publish --provenance + trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # requires maintainer approval before this job runs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Classic npm token (granular, read/write on the dropley package).
          # Provenance still records GitHub Actions as the builder — the auth
          # method is independent of --provenance.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}